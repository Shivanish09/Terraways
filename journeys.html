<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Terraways — MP Journey Planner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#18211c;--moss:#244334;--cream:#f6f3ec;--line:rgba(24,33,28,.14)}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:"DM Sans",sans-serif;overflow-x:hidden}@keyframes twIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}.card{animation:twIn .45s ease both}.photo{transition:opacity .35s,transform .5s}.card:hover .photo{transform:scale(1.03)}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #f2b15d;outline-offset:3px}header{padding:25px clamp(24px,6vw,82px) 82px;color:#fff;background:linear-gradient(90deg,rgba(12,31,20,.82),rgba(12,31,20,.35)),url('https://images.unsplash.com/photo-1548013146-72479768bada?auto=format&fit=crop&w=1900&q=85') center/cover}.nav{display:flex;justify-content:space-between;align-items:center}.brand{font:27px "Playfair Display",serif}.brand i{color:#f2b15d;font-style:normal}.back{color:#fff;text-decoration:none;font-size:14px}.eyebrow{font:500 10px "DM Mono",monospace;letter-spacing:1.4px;text-transform:uppercase;color:#ebc784;margin-top:84px}h1{font:600 clamp(43px,6vw,76px)/1 "Playfair Display",serif;letter-spacing:-2.7px;max-width:700px;margin:17px 0}.sub{font-size:16px;max-width:520px;line-height:1.5;color:#e3ece3}.journey-settings{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}.journey-settings label{border:1px solid rgba(255,255,255,.48);border-radius:4px;padding:7px 10px;font:10px "DM Mono",monospace;letter-spacing:.7px;text-transform:uppercase;color:#d4e1d5}.journey-settings input,.journey-settings select{display:block;border:0;background:transparent;color:#fff;padding:3px 0 0;max-width:150px;font:600 13px "DM Sans",sans-serif;outline:0}.journey-settings option{color:var(--ink)}main{padding:65px clamp(24px,6vw,82px)}.toolbar{display:flex;gap:12px;align-items:center;margin-bottom:18px}.toolbar input{flex:1;border:1px solid var(--line);border-radius:4px;padding:14px;background:#fff;font:14px "DM Sans",sans-serif}.filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:25px}.filter{border:1px solid var(--line);background:#fff;border-radius:99px;padding:8px 12px;color:#526056;font:600 12px "DM Sans",sans-serif;cursor:pointer}.filter.active{background:var(--moss);color:#fff;border-color:var(--moss)}.count{font:12px "DM Mono",monospace;color:#647168;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.card{overflow:hidden;background:#fff;border:1px solid var(--line);border-radius:5px}.photo{display:none;height:130px;background:center/cover}.photo.show{display:block}.copy{padding:14px}.type{font:500 10px "DM Mono",monospace;letter-spacing:.9px;color:#55715c;text-transform:uppercase}.card h2{font:500 21px/1.08 "Playfair Display",serif;margin:8px 0 5px}.city{font-size:12px;color:#69766d}.actions{display:flex;justify-content:space-between;align-items:center;margin-top:14px}.add{border:0;border-radius:99px;background:var(--moss);color:#fff;padding:7px 10px;font:700 11px "DM Sans",sans-serif;cursor:pointer}.earth{color:var(--moss);font-size:12px;font-weight:700;text-decoration:none}.route{position:fixed;right:24px;bottom:22px;background:var(--moss);color:#fff;border-radius:99px;padding:13px 17px;text-decoration:none;font-size:13px;font-weight:700;box-shadow:0 8px 24px rgba(24,33,28,.25)}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:480px){header{padding-bottom:54px}.eyebrow{margin-top:54px}.grid{grid-template-columns:1fr}.toolbar{display:block}.toolbar input{width:100%}}
  </style>
</head>
<body>
  <header><div class="nav"><div class="brand">terra<i>ways</i></div><a class="back" href="index.html">← Back to nearby</a></div><div class="eyebrow">Madhya Pradesh journey planner</div><h1>Choose a journey worth the distance.</h1><p class="sub">Search iconic temples, waterfalls, wildlife reserves, and heritage sites across Madhya Pradesh.</p><div id="journey-location-status" style="width:100%;font:12px "DM Sans",sans-serif;color:#dbe7dc;margin-bottom:8px">📍 Detecting your location…</div><div class="journey-settings"><label>Where to?<input id="journey-where" list="journey-locations" placeholder="Anywhere in MP"><datalist id="journey-locations"><option value="Ujjain"><option value="Pachmarhi"><option value="Kanha"><option value="Khajuraho"><option value="Bhedaghat"><option value="Mandu"></datalist></label><label>Specific date<input id="journey-date" type="date"></label><label>Season<select id="journey-season"><option value="">Any season</option><option value="Spring">Spring</option><option value="Summer">Summer</option><option value="Monsoon">Monsoon</option><option value="Winter">Winter</option></select></label><label>Travellers<select id="journey-travellers"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6+</option></select></label></div></header>
  <main><div class="toolbar"><input id="search" type="search" placeholder="Search a place, city, or experience"></div><div class="filters" id="filters"></div><div class="count" id="count"></div><section class="grid" id="grid"></section></main><a class="route" id="view-my-route" href="hotel.html">View my route →</a>
  <script>

    const twTrip = { ...JSON.parse(sessionStorage.getItem('terraways-trip') || '{}') };
    function saveTrip(patch){ Object.assign(twTrip, patch); sessionStorage.setItem('terraways-trip', JSON.stringify(twTrip)); }
    const places=[['Khajuraho Group of Monuments','Khajuraho','Heritage','Khajuraho_Group_of_Monuments',5],['Sanchi Stupa','Raisen','Heritage','Sanchi',6],['Mandu Forts & Palaces','Dhar','Heritage','Mandu,_Madhya_Pradesh',8],['Orchha Fort Complex','Orchha','Heritage','Orchha',9],['Mahakaleshwar Temple','Ujjain','Temple','Mahakaleshwar_Jyotirlinga',0],['Omkareshwar Jyotirlinga','Khandwa','Temple','Omkareshwar_Temple',1],['Bhedaghat Marble Rocks','Jabalpur','Nature','Bhedaghat',12],['Dhuandhar Falls','Jabalpur','Waterfall','Dhuandhar_Falls',13],['Bee Falls','Pachmarhi','Waterfall','Pachmarhi',14],['Patalpani Waterfall','Indore','Waterfall','Patalpani_waterfall',15],['Kanha Tiger Reserve','Mandla','Wildlife','Kanha_Tiger_Reserve',19],['Bandhavgarh Tiger Reserve','Umaria','Wildlife','Bandhavgarh_National_Park',20],['Pench Tiger Reserve','Seoni','Wildlife','Pench_National_Park',21],['Panna Tiger Reserve','Panna','Wildlife','Panna_National_Park',23],['Amarkantak','Anuppur','Spiritual','Amarkantak',26],['Chanderi','Ashoknagar','Heritage','Chanderi',10]].map(p=>({name:p[0],city:p[1],type:p[2],wiki:p[3],id:p[4]}));
    const journeyCoords={Ujjain:[23.1793,75.7849],Raisen:[23.3301,77.7824],Dhar:[22.6013,75.3025],Orchha:[25.3518,78.6415],Khandwa:[21.8314,76.3498],Jabalpur:[23.1815,79.9864],Pachmarhi:[22.4674,78.4344],Indore:[22.7196,75.8577],Mandla:[22.5988,80.3714],Umaria:[23.5245,80.8365],Seoni:[22.0869,79.5435],Panna:[24.7215,80.1873],Anuppur:[23.103,81.695],Ashoknagar:[24.577,77.7318]};
    let userJourneyPosition=null;
    function journeyDistance(a,b){const r=x=>x*Math.PI/180;const dLat=r(b[0]-a[0]),dLon=r(b[1]-a[1]);const x=Math.sin(dLat/2)**2+Math.cos(r(a[0]))*Math.cos(r(b[0]))*Math.sin(dLon/2)**2;return 6371*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));}
    let filter='All',query='',route=JSON.parse(localStorage.getItem('terraways-mp-route')||'[]');const filters=['All',...new Set(places.map(p=>p.type))];document.getElementById('filters').innerHTML=filters.map(t=>`<button class="filter ${t==='All'?'active':''}" data-filter="${t}">${t}</button>`).join('');
    const photo=async(el,page)=>{try{const r=await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(page)}`);const d=await r.json(),src=d.originalimage?.source||d.thumbnail?.source;if(src){el.style.backgroundImage=`url("${src}")`;el.classList.add('show')}}catch(_){}};
    function render(){const shown=places.filter(p=>(filter==='All'||p.type===filter)&&`${p.name} ${p.city} ${p.type}`.toLowerCase().includes(query)).map(p=>({...p,distance:userJourneyPosition&&journeyCoords[p.city]?journeyDistance(userJourneyPosition,journeyCoords[p.city]):null})).sort((a,b)=>(a.distance??Infinity)-(b.distance??Infinity));document.getElementById('count').textContent=`${shown.length} faraway journeys to consider`;document.getElementById('grid').innerHTML=shown.map(p=>`<article class="card"><div class="photo" data-wiki="${p.wiki}"></div><div class="copy"><div class="type">${p.type}</div><h2>${p.name}</h2><div class="city">${p.city}, Madhya Pradesh${p.distance!=null?` · ${Math.round(p.distance)} km away`:''}</div><div class="actions"><button class="add" data-id="${p.id}">${route.includes(p.id)?'Saved ✓':'Add to route +'}</button><a class="earth" target="_blank" rel="noopener" href="https://earth.google.com/web/search/${encodeURIComponent(p.name+', '+p.city+', Madhya Pradesh')}">Google Earth ↗</a></div></div></article>`).join('');document.querySelectorAll('.photo').forEach(el=>photo(el,el.dataset.wiki))}
    document.getElementById('search').addEventListener('input',e=>{query=e.target.value.toLowerCase();render()});document.getElementById('filters').addEventListener('click',e=>{const b=e.target.closest('[data-filter]');if(!b)return;filter=b.dataset.filter;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));render()});document.getElementById('grid').addEventListener('click',e=>{const b=e.target.closest('[data-id]');if(!b)return;const id=Number(b.dataset.id);route=route.includes(id)?route.filter(x=>x!==id):[...route,id];localStorage.setItem('terraways-mp-route',JSON.stringify(route));render()});const params=new URLSearchParams(location.search);['where','date','season','travellers'].forEach(key=>{const element=document.getElementById(`journey-${key}`);if(element&&params.get(key))element.value=params.get(key)});document.querySelectorAll('.journey-settings input,.journey-settings select').forEach(element=>element.addEventListener('change',()=>{const next=new URLSearchParams(location.search);next.set(element.id.replace('journey-',''),element.value);history.replaceState(null,'',`?${next.toString()}`);render()}));
    async function detectJourneyLocation(){const status=document.getElementById('journey-location-status');if(!navigator.geolocation){status.textContent='📍 Location unavailable — you can search manually.';return;}try{const pos=await new Promise((resolve,reject)=>navigator.geolocation.getCurrentPosition(resolve,reject,{enableHighAccuracy:false,timeout:12000,maximumAge:300000}));userJourneyPosition=[pos.coords.latitude,pos.coords.longitude];status.textContent='📍 Nearby journeys are prioritised from your current location.';render();}catch(e){status.innerHTML='📍 Location permission not available. <button id="journey-retry" type="button" style="border:0;border-bottom:1px solid currentColor;background:transparent;color:#fff;cursor:pointer">Try again</button>';}}
document.addEventListener('click',e=>{if(e.target.closest('#journey-retry'))detectJourneyLocation()});
    document.getElementById('view-my-route').addEventListener('click',()=>{ const destination=document.getElementById('journey-where').value.trim()||new URLSearchParams(location.search).get('destination')||twTrip.destination||''; saveTrip({origin:new URLSearchParams(location.search).get('from')||twTrip.origin||'',destination,date:document.getElementById('journey-date').value||twTrip.date||'',season:document.getElementById('journey-season').value||twTrip.season||'',travellers:document.getElementById('journey-travellers').value||twTrip.travellers||'2'}); });
    function updateRouteLink(){const link=document.getElementById('view-my-route');const current=new URLSearchParams(location.search);if(document.getElementById('journey-where').value)current.set('where',document.getElementById('journey-where').value);if(document.getElementById('journey-date').value)current.set('date',document.getElementById('journey-date').value);if(document.getElementById('journey-season').value)current.set('season',document.getElementById('journey-season').value);if(document.getElementById('journey-travellers').value)current.set('travellers',document.getElementById('journey-travellers').value);const destination=document.getElementById('journey-where').value.trim();if(destination)current.set('destination',destination);link.href=`hotel.html?${current.toString()}`;}
    document.querySelectorAll('.journey-settings input,.journey-settings select').forEach(element=>element.addEventListener('input',updateRouteLink));
    document.querySelectorAll('.journey-settings input,.journey-settings select').forEach(element=>element.addEventListener('change',updateRouteLink));
    updateRouteLink();render();detectJourneyLocation();
  </script>
</body>
</html>
